# Construit l'ISO live de Sama OS pour PC (amd64) sur les serveurs de GitHub.
# Déclenchement : à chaque envoi sur la branche principale, ou à la main depuis l'onglet « Actions ».
# L'ISO est téléchargeable pendant 14 jours dans les « artefacts » de l'exécution.

name: ISO PC (amd64)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: iso-pc
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque (la construction demande environ 15 Go)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Construire l'ISO
        env:
          # Depuis les serveurs de GitHub, le miroir officiel est le plus rapide
          SAMA_MIROIR: http://deb.debian.org/debian/
        run: scripts/construire-iso.sh amd64

      - name: Mettre l'ISO à disposition
        uses: actions/upload-artifact@v4
        with:
          name: samaos-pc-amd64
          path: sortie/*.iso
          retention-days: 14
          compression-level: 0

      - name: Garder le journal de construction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-construction
          path: sortie/build-*.log
          retention-days: 14
