set default=0
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    # Résolution native de l'écran, pour un menu net
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

# Polices de Sama (générées à la construction)
loadfont /boot/grub/live-theme/sama-titre.pf2
loadfont /boot/grub/live-theme/sama-menu.pf2
loadfont /boot/grub/live-theme/sama-aide.pf2

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
