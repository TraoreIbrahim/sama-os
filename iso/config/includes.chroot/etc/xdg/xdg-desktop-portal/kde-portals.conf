# Portails de bureau de Sama : ceux de KDE, sauf le choix des fichiers (Enregistrer sous, Ouvrir), fait par Sama
# (/usr/libexec/samaos/portail-fichiers, qui passe la main au sélecteur de KDE s'il ne peut pas s'ouvrir).
# Ce fichier remplace /usr/share/xdg-desktop-portal/kde-portals.conf : il en reprend les lignes.
[preferred]
default=kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.FileChooser=samaos;kde;
