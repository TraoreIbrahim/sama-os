# Menu de démarrage de Sama OS installé.
# Sama seul sur l'ordinateur : pas de menu, démarrage direct (Échap pendant 2 s pour l'afficher quand même).
# Un autre système trouvé (Windows…) : le menu s'affiche 5 secondes pour choisir.
if command -v os-prober >/dev/null 2>&1 && [ -n "$(os-prober 2>/dev/null)" ]; then
	GRUB_TIMEOUT=5
	GRUB_TIMEOUT_STYLE=menu
else
	GRUB_TIMEOUT=2
	GRUB_TIMEOUT_STYLE=hidden
fi
GRUB_GFXMODE=auto
GRUB_THEME=/usr/share/grub/themes/samaos/theme.txt
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# Détecter Windows (et les autres systèmes) pour le double démarrage
GRUB_DISABLE_OS_PROBER=false
