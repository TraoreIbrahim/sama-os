# Menu de démarrage de Sama OS installé
# Le menu s'affiche 5 secondes : utile quand Windows est installé à côté.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=auto
GRUB_THEME=/usr/share/grub/themes/samaos/theme.txt
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# Détecter Windows (et les autres systèmes) pour le double démarrage
GRUB_DISABLE_OS_PROBER=false
