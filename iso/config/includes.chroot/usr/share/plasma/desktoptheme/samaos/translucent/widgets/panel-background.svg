<svg xmlns="http://www.w3.org/2000/svg" width="116" height="116" viewBox="0 0 116 116">
  <!-- Natte translucide sur flou, comme la maquette : rgba(250,246,240,0.66) + flou -->
  <style type="text/css" id="current-color-scheme">.ColorScheme-Background { color:#fbf9f6; }</style>
  <g class="ColorScheme-Background" fill="currentColor" fill-opacity="0.66">
    <path id="topleft" d="M28 0 A28 28 0 0 0 0 28 L28 28 Z"/>
    <rect id="top" x="28" y="0" width="60" height="28"/>
    <path id="topright" d="M88 0 A28 28 0 0 1 116 28 L88 28 Z"/>
    <rect id="left" x="0" y="28" width="28" height="60"/>
    <rect id="center" x="28" y="28" width="60" height="60"/>
    <rect id="right" x="88" y="28" width="28" height="60"/>
    <path id="bottomleft" d="M0 88 A28 28 0 0 0 28 116 L28 88 Z"/>
    <rect id="bottom" x="28" y="88" width="60" height="28"/>
    <path id="bottomright" d="M88 88 L116 88 A28 28 0 0 1 88 116 Z"/>
  </g>
  <!-- Forme du flou d'arrière-plan : la pilule entière, coins arrondis compris -->
  <g fill="#000000">
    <path id="mask-topleft" d="M28 0 A28 28 0 0 0 0 28 L28 28 Z"/>
    <rect id="mask-top" x="28" y="0" width="60" height="28"/>
    <path id="mask-topright" d="M88 0 A28 28 0 0 1 116 28 L88 28 Z"/>
    <rect id="mask-left" x="0" y="28" width="28" height="60"/>
    <rect id="mask-center" x="28" y="28" width="60" height="60"/>
    <rect id="mask-right" x="88" y="28" width="28" height="60"/>
    <path id="mask-bottomleft" d="M0 88 A28 28 0 0 0 28 116 L28 88 Z"/>
    <rect id="mask-bottom" x="28" y="88" width="60" height="28"/>
    <path id="mask-bottomright" d="M88 88 L116 88 A28 28 0 0 1 88 116 Z"/>
  </g>
  <!-- Marges intérieures de la Natte : 8 px autour des éléments de 44 px (barre de 60 px) -->
  <g fill="none">
    <rect id="hint-top-margin" x="0" y="0" width="8" height="8"/>
    <rect id="hint-bottom-margin" x="0" y="0" width="8" height="8"/>
    <rect id="hint-left-margin" x="0" y="0" width="8" height="8"/>
    <rect id="hint-right-margin" x="0" y="0" width="8" height="8"/>
  </g>
</svg>
